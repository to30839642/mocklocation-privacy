<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --muted: #5c5c5c;
    --bg: #fdfdfc;
    --rule: #e0dedb;
    --accent: #1b5e9c;
    --code-bg: #f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e6e4e1;
      --muted: #a3a09b;
      --bg: #16171a;
      --rule: #32343a;
      --accent: #7db2e8;
      --code-bg: #24262b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.25rem 6rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
          "PingFang TC", "Microsoft JhengHei", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 46rem; margin: 0 auto; }
  h1 { font-size: 1.9rem; line-height: 1.3; margin: 2.5rem 0 1rem; }
  h1:first-of-type { margin-top: 0; }
  h2 { font-size: 1.2rem; line-height: 1.4; margin: 2.5rem 0 .75rem; }
  p, li { overflow-wrap: break-word; }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 3rem 0; }
  code {
    background: var(--code-bg);
    padding: .1em .35em;
    border-radius: 3px;
    font-size: .875em;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  /* Tables scroll sideways on a phone instead of widening the page. */
  .table-wrap { overflow-x: auto; margin: 1.25rem 0; }
  table { border-collapse: collapse; width: 100%; min-width: 34rem; font-size: .93rem; }
  th, td { text-align: left; vertical-align: top; padding: .6rem .8rem; border-bottom: 1px solid var(--rule); }
  th { font-weight: 600; white-space: nowrap; }
  blockquote { margin: 1.25rem 0; padding-left: 1rem; border-left: 3px solid var(--rule); color: var(--muted); }
  footer { max-width: 46rem; margin: 4rem auto 0; padding-top: 1.5rem;
           border-top: 1px solid var(--rule); color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<main>
{{ content }}
</main>
<footer>{{ site.title }}</footer>
<script>
  // Wrap each table so a narrow screen scrolls the table, not the document.
  document.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'table-wrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
</script>
</body>
</html>
